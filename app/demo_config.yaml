pool_b:  # second artist pool, fixed on 19-10-2026 before any pool B score or label was produced
  coverage_years: [2018, 2023]  # first and last year of the counted window of the coverage rule
  min_distinct_years: 2  # least distinct years with dated Works inside that window
  genre_map:  # fixed mapping from the most frequent Discogs genre of an artist to the demo genre label
    Pop: "Pop"  # Pop
    Hip Hop: "Hip hop"  # Hip hop
    Funk / Soul: "R&B / soul"  # R&B / soul
    Latin: "Latino"  # Latino
    Rock: "Rock / alternative"  # Rock / alternative
    "Folk, World, & Country": "Country"  # Country
    Electronic: "Electronic"  # Electronic
  genre_unmapped: keep  # a Discogs genre that is not in the map keeps its Discogs name
  genre_ties: alphabetical  # ties between genres with the same count go to the first name in alphabetical order
  pool_lists: {a: artists, b: artists_b}  # config list of each pool
  paths:  # pool B files, relative to the project root, written by later steps with exclusive creation, none exists yet
    works: results/demo/works_demo_b.csv  # Works of the pool B artists for the timeline cards
    when_features: results/demo/live/when_features_b.csv  # WHEN feature rows of the pool B artists
    when_scores: results/demo/when_demo_scores_b.csv  # WHEN scores, labels and train rows of the pool B artists
    what_features: results/demo/live/what_features_b.csv  # WHAT feature rows of the pool B artists
    what_labels: results/demo/live/what_labels_b.csv  # WHAT labels and after-holdout flags of the pool B artists
    what_control: results/demo/live/control_what_b.csv  # control results of the pool B WHAT step

