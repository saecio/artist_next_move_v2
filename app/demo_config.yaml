    example_days: 6  # days of rain in the reading card example
    example_total: 10  # days in the reading card example
    note_gap: 0.02  # gap of the top Timing bin above which the "too confident" note is shown
  photo: {width: 150, height: 165, content_weight: 900, card_height: 262, question_extra: 63, radius: 4, focus: "50% 20%", name_font: 22, question_font: 16, monogram_font: 64, monogram_opacity: 0.25, credit_font: 10, credit_line: 12, credit_margin: 6, credit_opacity: 1, bottom_pad: 16}  # tab 1 artist card (credit_font, credit_line and credit_margin in px for the one-line credit under the photo, credit_opacity of the muted credit text, bottom_pad px under the credit line, equal to the space above the photo; the photo height is the card content height minus the credit line and margin): photo column width and height, relative width of the content column, card height (px), corner radius (px), object-position of the photo, name and question sizes (px), monogram size (px) and background opacity
  story:  # tab 1 timeline marker
