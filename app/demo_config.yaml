  tab3_series:  # the two charts of tab 3, in order
    - {key: style, file: h1_buckets, bucket: bucket, rate: new_style_rate, count: transitions, hypothesis: H1, title: t3_card_style, line: t3_line_style}  # Style card
    - {key: timing, file: h6_buckets, bucket: bucket, rate: release_next_year_rate, count: artist_years, hypothesis: H6, title: t3_card_timing, line: t3_line_timing}  # Timing card
  cards:  # plain-language cards of the Six tests view (tab 3); texts as given for the demo, numbers filled from the data
    h2_bucket: "3-5"  # history group of the Hypothesis 2 test used in the card (notebook 02 cell 54)
    h2_genre_a: Electronic  # genre named first in the H2 answer
    h2_genre_b: "Folk, World, & Country"  # genre named second in the H2 answer
    h3_gap_pause: "11+"  # year-gap bucket named in the H3 answer
    h3_gap_none: "0"  # year-gap bucket of no pause
    items:  # per hypothesis: plain question, answer template, effect measure, short label of the chart
      H1: {question: "Do artists with a long catalogue try fewer styles new to them?", answer: "Yes. With 3 to 5 earlier releases, {first} bring a style new to them. With 51 or more, {last}.", measure: "Cramer's V", short_label: "Catalogue size"}  # values from h1_buckets.csv
      H2: {question: "Does the genre change how often artists try styles new to them?", answer: "Yes. Among artists with a short history, {a} of electronic artists try a style new to them, against {b} of folk and country artists.", measure: "Cramer's V", short_label: "Genre"}  # a, b from the 3-5 group of the H2 test
      H3: {question: "Does a long pause before a release mean a style new to them?", answer: "A little. After a pause of 11 years or more, {a} bring a style new to them. With no pause, {b}.", measure: "rank-biserial", short_label: "Pause before a release"}  # a, b from the year-gap buckets
      H4: {question: "Do artists who already tried many styles keep trying new ones?", answer: "Not by itself. It only shows when we compare artists with a similar number of releases.", measure: "Cramer's V", short_label: "Styles already tried"}  # no placeholders
      H5: {question: "Do artists with undated releases behave differently?", answer: "They bring fewer styles new to them ({a} against {b}), but the difference mostly disappears when we compare artists with similar catalogues.", measure: "Cramer's V", short_label: "Undated releases"}  # a undated, b dated
      H6: {question: "Does a long silence mean no release next year?", answer: "Yes. One year after the last release, {first} release again the next year. After 10 years or more, {last}.", measure: "Cramer's V", short_label: "Silence since the last release"}  # values from h6_buckets.csv
design:  # visual system of the demo: the only place for colors, type scale and chart settings
  palette:  # hex values; .streamlit/config.toml must equal background, card, text, line, timing (a test checks it)
    background: "#F4F1EA"  # paper page
    card: "#FFFFFF"  # cards
    tint: "#ECE7DB"  # paper tint of bands and chip fills
    text: "#1B1B1F"  # main text, the ink
    muted: "#6B675E"  # secondary text
    line: "#DDD8CC"  # borders, rules and grid
    timing: "#0F6B6B"  # the Timing question, on every tab and chart
    style: "#D9482B"  # the Style question, on every tab and chart
    chance: "#C9C4B8"  # By chance bar
    rule: "#8A8578"  # Release counts bar
    highlight: "#C98A12"  # accent for emphasis
    style_text: "#B83A20"  # darker Style color for small text only (contrast 5.7 on cards, the plain color is 4.3)
    highlight_text: "#8A5C00"  # darker highlight for small text only (contrast 5.8 on cards, the plain color is 3.0)
  shadow: "none"  # cards have a thin border and no shadow
  font:  # typefaces, self-hosted; .streamlit/config.toml must name the same two families and files (a test checks it)
    heading: "Fraunces"  # serif headlines and big numbers (weights 500 and 600)
    body: "Inter"  # everything else
    fallback: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"  # system fonts used until the files load
    tab_weight: 600  # weight of the tab labels
  type:  # type scale in px
    headline: 28  # page headline
    subtitle: 15  # line under the headline
    big: 44  # big number
    label: 13  # label
    caption: 12  # caption
    eyebrow: 11  # small uppercase card label
    head_tracking: "-0.01em"  # letter spacing of headlines and big numbers
    eyebrow_tracking: "0.06em"  # letter spacing of the uppercase card labels
    line: 1.45  # body text line height
  box: {radius: 4, border: 1, pad: 18, gap: 12}  # card radius, border width, padding and gap in px
  method_axis_start: 1985  # first year of the tab 4 time axis (the last year is the last test year of the final exam)
  method_tick_every: 10  # tab 4 axis: a year label every this many years
  method:  # tab 4 infographic and tab 8 marker, sizes in px
    label_w: 120  # run label column
    row_h: 32  # height of one run
    row_gap: 4  # space between runs
    text_pad: 6  # padding left of the train label and gap around the lock
    test_radius: 4  # corner of a test block
    lock_w: 14  # lock body width
    lock_h: 10  # lock body height
    shackle_h: 7  # lock shackle height
    arrow_len: 28  # arrow between model chips, shaft length
    arrow_head: 5  # arrow head half height
    arrow_lift: 12  # lift of arrows and the tooltip icon to the middle of a chip
    dot: 14  # round marker of the tab 8 cards
    swatch_w: 22  # width of a legend swatch of tab 4
    swatch_h: 12  # height of a legend swatch of tab 4
  chip: {pad_v: 3, pad_h: 10, font: 11, radius: 2}  # chip sizes in px
  header: {title_font: 20, tagline_font: 14, gap: 14, top_pad: 56}  # header sizes in px, top_pad is the space above the header (page padding)
  cover: {height_vh: 70, min_height: 420, image_width: 1920, text_left: 5, text_width: 30, title_font: 3.6, title_min: 34, title_max: 72, line_font: 17, meta_font: 14, shade: "4D", gap: 14}  # cover tab: container height (vh, with a px floor), picture width stored in px, text column left offset and width (percent of the container), title size (vw with px floor and ceiling), tagline and author lines (px), flat shade over the picture as a hex alpha byte (4D is 30 percent), space between lines (px)
  button: {weight: 600, radius: 4}  # button label weight and corner radius in px (active fill is the text color, label is the palette background)
  genre_story_start_year: 1990  # first year of the Genres headline comparison
