live:  # live scoring assets and stored files read by src/app_live.py, relative to the project root
  folder: results/demo/live  # WHEN and WHAT models, columns and feature files
  when_models: {next_1y: when_next_1y.json, next_2y: when_next_2y.json}  # model file per WHEN target, inside folder
  what_model: what_stage0.json  # WHAT stage 0 model, inside folder
  columns: columns.json  # ordered model input columns, inside folder
  when_features: when_features.csv  # WHEN feature rows of the demo artists, inside folder
  what_features: what_features_all_years.csv  # WHAT feature rows of the demo artists, every eligible artist-year from the holdout start, inside folder
  what_labels: what_labels.csv  # WHAT stored label and after-holdout flag of those rows, inside folder
  what_control: control_what_all_years.csv  # control results of the extended WHAT step, inside folder
  what_features_year_end: what_features_year_end.csv  # WHAT feature rows of the year-end rows, inside folder
  what_labels_year_end: what_labels_year_end.csv  # labels and after-holdout flags of those rows, inside folder
  what_control_year_end: control_what_year_end.csv  # control results of the WHAT year-end step, inside folder
  what_top10: results/holdout_what/top10_lift.csv  # holdout top 10% figures of WHAT, read at load time
  what_top10_model: "stage 0"  # model name of the row used in that file
  what_features_control: what_features.csv  # first WHAT feature file (holdout rows only), kept as the control reference, not read by the app
  style_folder: results/demo/live/style  # per-year Random Forests, panel rows and percentiles
  style_model_pattern: "random_forest_{year}.joblib"  # per-year model file name, {year} is replaced
  style_panel: panel_rows.csv  # style panel rows, inside style_folder
  style_percentiles: percentiles.csv  # residual percentiles, inside style_folder
  style_panel_extra: panel_rows_extra.csv  # panel rows of origin 2022 (target year 2023), inside style_folder
  style_percentiles_extra: percentiles_extra.csv  # residual percentiles of target year 2023, inside style_folder
  style_actuals: actuals.csv  # actual Works and labels per style and target year, 2018 to 2024, inside style_folder
  style_extra_years: [2023]  # target years with an extra per-year model in style_folder
  when_scores: results/demo/when_demo_scores.csv  # stored WHEN scores, labels and train rows
  when_year_end: results/demo/when_demo_scores_year_end.csv  # stored WHEN scores of the year-end rows (artist-years without a Work), long format
  what_scores: results/holdout_what/row_scores.csv  # stored WHAT scores, labels and baseline (c)
  what_scores_year_end: results/demo/what_scores_year_end.csv  # stored WHAT scores of the year-end rows (reference only, never counted)
  works: results/demo/works_demo.csv  # Works of the demo artists for the timeline
  release_pick: results/demo/release_pick.csv  # release title per artist-year for the reality cells (rule B)
  what_new_styles: results/demo/what_new_styles.csv  # new styles of the next active year per artist and year, for the WHAT reality of the tab 6 panel
  style_predictions: results/style_forecast/predictions.csv  # stored style forecast, validation display only

game:  # tab 6 flow, thresholds, widget keys and texts
  hide_rerecordings: true  # hide cards of Works flagged is_rerecording, scores and labels are unchanged
  similar_gap: 1  # largest gap, in whole artists out of 10, between the outside rate and the base rate still worded "almost the same"
  default_mode: many  # mode shown first in tab 6: many (several artists) or one (one artist)
  mode_label: "View"  # mode selector label
  mode_options: {one: "One artist", many: "Several artists"}  # mode selector texts
  threshold: 0.5  # the model says yes when the live next_1y score is at least this value
  second_horizon: 2  # years of the second horizon, used by the within-years texts
  reliability_scale: 10  # the reliability lines say x in this many artists, the figures are rounded to it
  keys:  # session_state and widget keys, {id} and {year} are replaced
    state: game  # session_state key holding one state per artist
    mode: game_mode  # mode selector
    genre: game_genre  # genre selector
    artist: game_artist  # artist selector
    user_pred: "game_user_pred_{id}"  # checkbox of the optional user prediction
    answer: "game_answer_{id}_{year}"  # yes / no choice
    lock: "game_lock_{id}"  # lock button
    reveal: "game_reveal_{id}"  # reveal button
    next: "game_next_{id}"  # next year button
    restart: "game_restart_{id}"  # restart button
  user_prediction_label: "My prediction"  # checkbox text
  answer_yes: "Yes"  # yes option and verdict word
  answer_no: "No"  # no option and verdict word
  lock_label: "Lock my answer"  # lock button
  reveal_label: "Show reality"  # reveal button
  next_label: "Go to {year}"  # next year button, {year} is the next playable year
  restart_label: "Restart"  # restart button
  what_reliability: "When the model says Likely, about {x} in {scale} artists did add a new style, against {y} in {scale} overall."  # reliability line of a Yes verdict, x and y come from the holdout file, {scale} from reliability_scale
  what_reliability_no_similar: "When the model says Not likely, about {z} in {scale} still added a new style, about the same as overall ({y} in {scale})."  # No verdict, z and y equal or one unit apart
  what_reliability_no_other: "When the model says Not likely, about {z} in {scale} still added a new style, against {y} in {scale} overall."  # No verdict, z and y more than one unit apart
  what_reality_yes: "Reality: Yes, new style: {styles}"  # step B, stored label is yes, {styles} are the new styles of the next active year
  what_reality_no: "Reality: No new style"  # step B, stored label is no
  what_no_reality: "No later release with styles in the data yet."  # step B, score but no stored label
  hidden_line: "{n} re-recording(s) hidden"  # line under a year with hidden re-recordings
  more_line: "+{n} more"  # line under the drawn cards when the year has more Works than the cap
  last_year_text: "This is the last year in the data."  # next button disabled
  empty_text: "No predictions available for this artist."  # artist without scores
  unseen_warning: "The model has not seen this artist before."  # artist_train_rows is 0
  what_years_warning: "Style predictions need at least {n} earlier releases."  # WHAT coverage, {n} from the config
  board_model: "Model right: {right} of {n}"  # artist board
  board_user: "You right: {right} of {n}"  # artist board, user years only
  board_agree: "You and the model agree: {right} of {n}"  # artist board, user years only
  board_total: "All artists, model right: {right} of {n}"  # all artists
  board_total_user: "All artists, you right: {right} of {n}"  # all artists, user years only
  board_none: "Nothing scored yet."  # no counted year

poc:  # tab 6 mode 1 timeline and panel: texts, colors and sizes shared by tab 6 and tab 7
  titles_per_card: 3  # most Work titles drawn on a card, the rest is a "+N more" line
  years_before: 5  # years shown before the current year, 0 for both years_before and years_after means all years
  years_after: 1  # years shown after the current year
  texts:  # texts of the page, the flow texts come from the game: section
    label_timing: "Timing"  # small grey label of the first block
    label_style: "Style"  # small grey label of the second block
    q_timing: "Will the artist release something next year?"  # question of the Timing block, the only place it is shown
    q_style: "Will the next release bring a new style?"  # question of the Style block
    style_scope: "Next release, whenever it comes. Separate from the question above. New means not used up to {year}."  # grey line of the Style block, {year} is the shown year
    your_prediction: "Your prediction:"  # line of the user answer, Timing block only
    prediction: "Prediction:"  # line of the model prediction
    within_two: "Within {n} years:"  # line of the second-horizon prediction, shown by the cascade rule, {n} from game.second_horizon
    reality: "Reality:"  # line of the reality
    reality_two: "Reality, within {n} years:"  # line of the second-horizon reality
    score_tip: "Model score {score:.2f}, not a probability"  # hover text of a prediction word
    release_line: "{title} ({year})"  # release under a reality line, {year} is the year of the release
    release_year_only: "Release in {year}"  # same line when the file has no title
    used_before: "(none new)"  # after the styles of the release of a No reality
    more_styles: "+{n}"  # after the first styles when there are more
    max_styles: 3  # most style names shown in a line
    unknown: "?"  # cell not known before the reveal
    earlier_hidden: "Earlier years hidden"  # marker when the window cuts earlier years
    likely: "Likely"  # WHAT verdict Yes
    not_likely: "Not likely"  # WHAT verdict No
    mark_dot: "●"  # grey mark before the reveal or without reality
    mark_ok: "✓"  # mark of a prediction that matches the reality
    mark_bad: "✗"  # mark of a prediction that does not match the reality
    mark_ok_flagged: "✓*"  # prediction equals the reality, result shown for reference only (green, with an asterisk)
    mark_bad_flagged: "✗*"  # prediction differs from the reality, result shown for reference only (red, with an asterisk)
    legend_open_year: "* {year} is not over yet, so this result can still change"  # caption near the chips (mode 1), note under the table (mode 2) and tooltip of every asterisk mark there, {year} is the first year not over
    symbols_legend: "✓ right · ✗ wrong · ● no result yet"  # small grey line under the mode 2 table and under the mode 1 timeline once the marks are visible
    mark_when_title: "Timing"  # hover text of the timing mark
    mark_what_title: "Style"  # hover text of the style mark
    mark_not_forecast: "No prediction"  # hover text of the grey dot of a row without a WHAT score
    what_na: "—"  # grey cell of a row without a WHAT score
    what_na_tip: "No style prediction for this year"  # hover text of that cell
    what_na_tip_needs_three: "Needs at least {n} earlier releases"  # hover text of the grey dash of a year-end row with too few earlier releases, {n} from config.what.min_previous_works
    what_na_tip_no_later: "No later release in the data yet"  # hover text of the grey dash of a year-end row whose next release is not in the data
    future_card: "?"  # card of a year not revealed yet
    gap_card: "No release"  # card of a year without release, replaced by the year-end tag in a year-end year
    only_rerecordings: "Only re-recordings"  # card whose Works are all hidden re-recordings
  colors:  # result and mark colors, each with its own text color so they do not depend on the theme
    mark_green: {bg: "#16a34a", fg: "#ffffff"}  # solid mark: prediction matches the reality, white glyph
    mark_red: {bg: "#dc2626", fg: "#ffffff"}  # solid mark: prediction does not match the reality, white glyph
    mark_grey: {bg: "#6b7280", fg: "#ffffff"}  # solid mark: no reality yet, grey dot
    card_border: "rgba(128,128,128,0.6)"  # neutral border, readable on light and dark pages
    card_border_predicted: "#2563eb"  # border of the card of the predicted year
    chip_bg: "#e0e7ff"  # scoreboard chip background
    accent: "#6366f1"  # mode 2 verdict pills: Yes and Likely filled, No and Not likely outlined (not green or red, those mean right and wrong)
    accent_fg: "#ffffff"  # text on a filled pill
    placeholder_bg: "rgba(0,0,0,0.18)"  # mode 2 placeholder cell, dark in a dark theme and a soft tint in a light one
    placeholder_border: "rgba(128,128,128,0.7)"  # dashed border of a placeholder cell
    chip_fg: "#1e3a8a"  # scoreboard chip text
  sizes:  # sizes in pixels, except the opacity
    card_min_width: 110  # smallest card width, cards grow to fill the line
    card_gap: 4  # gap between cards
    card_padding: 6  # padding inside a card
    card_radius: 6  # corner radius
    card_font: 12  # card text size
    title_lines: 2  # most lines of one title
    mark_size: 24  # height and least width of a mark, shared by tab 6 mode 2, tab 7 and the proof of concept
    mark_font: 15  # glyph size of a mark
    mark_weight: 800  # glyph weight of a mark, bold
    mark_pad: 5  # horizontal padding of a mark, room for the asterisk
    pill_font: 12  # verdict pill text size
    pill_pad_v: 2  # verdict pill vertical padding
    pill_pad_h: 12  # verdict pill horizontal padding
    pill_border: 2  # verdict pill border width
    pill_radius: 999  # verdict pill corner radius, large for a full pill
    placeholder_border_width: 1  # dashed border width of a placeholder cell
    placeholder_opacity: 0.45  # opacity of the placeholder text
    multi_artist_col: 16  # width of the artist column of the mode 2 table, percent; the other columns share the rest equally
    predicted_border: 2  # border width of the predicted card
    predicted_shadow: 6  # shadow blur of the predicted card
    table_font: 12  # table text size
    cell_padding: 3  # cell padding
    note_font: 11  # size of the small notes under the table
    muted_opacity: 0.7  # opacity of secondary text, inherits the theme text color
    chip_font: 12  # chip text size

route:  # tab 6 mode 2: several artists in one year, read-only table
  year: 2019  # year shown first
  artists: [3272791, 3094075, 7592689, 6774153, 391170, 2866928, 1345479, 4357593, 5034422, 1154116]  # prepared selection by discogs_id: SZA, Romeo Santos, Olivia Rodrigo, boygenius, Arctic Monkeys, Kacey Musgraves, Charli XCX, Dua Lipa, BTS, Labrinth
  max_artists: 10  # most artists in the table
  mix_yes: 6  # Yes verdicts of a prepared selection, the 2019 route has 6 Yes and 4 No
  artists_by_year:  # prepared selection of a year other than route.year, built by pick_route of src/demo_multi.py
    2026: [4778, 5530, 38661, 51984, 52835, 151199, 219986, 222578, 391170, 3272791]  # 8 Yes and 2 No (only 2 artists with a 2026 Work have a No verdict): Mary J. Blige, Shakira, Eminem, Jennifer Lopez, Beyonce, Drake, Bruce Springsteen, Calvin Harris, Arctic Monkeys, SZA
  title_max_chars: 28  # longest title in a reality cell, longer titles end with an ellipsis and keep the full title in a tooltip
  selection_note: "Selection prepared for {year} to show both hits and misses. It is not a random sample."  # one line above the table, {year} is route.year
  keys:  # widget keys
    year: route_year  # year selector
    genre: route_genre  # genre filter
    artists: route_artists  # artist multiselect
    stage: route_stage  # session_state key of the two-step state
    predict: route_predict  # Predict button
    reveal: route_reveal  # Show reality button
  texts:  # texts of the table, the model words come from game: and poc:
    pick_label: "Artists in the table"  # multiselect label
    cap_note: "At most {n} artists in the table."  # shown under the picker
    col_artist: "Artist"  # table column
    col_timing: "Release next year?"  # header over the prediction and reality columns of the timing prediction
    col_style: "New style next release?"  # header over the prediction and reality columns of the style prediction
    col_style_tip: "About the next release, whenever it comes. Separate from the first question."  # hover text of the style header
    col_prediction: "Prediction"  # second header row
    col_reality: "Reality"  # second header row
    col_result: "Result"  # table column
    year_end_tag: "No release in {year} · prediction from earlier releases"  # small grey line of a year-end row (under the artist in mode 2, on the card and in the side panel of mode 1)
    pill_next: "Next year"  # small label of the next-year pill and reality
    pill_two: "Within {n} years"  # small label of the second-horizon pill and reality, {n} from game.second_horizon
    no_history_one: "{n} selected artist has no releases before {year}."  # line under the table, one artist with no history hidden
    no_history_many: "{n} selected artists have no releases before {year}."  # line under the table, several artists with no history hidden
    no_release_one: "{n} selected artist has no release yet in {year}."  # line under the table for the last data year, artist with history but no row
    no_release_many: "{n} selected artists have no release yet in {year}."  # same, several artists
    legend_cascade: "Within {n} years is shown only when the next-year prediction is No. A Yes next year already covers it."  # line in How to read this, {n} from game.second_horizon
    year_end_what_note: "Style predictions for years without a release are not counted."  # line in How to read this, both modes
    forecast_title: "Forecast for {year}"  # title line above the table or panel when the reality year has not happened
    forecast_note: "{year} has not happened yet, so there is nothing to compare."  # line under the title
    not_yet: "Not yet"  # reality cell of the forecast year
    selection_note_by_year:  # line above the table for a year with a prepared selection
      2026: "Selection prepared for {year}: artists with a release in {year}, picked by a fixed rule before any reality exists. It is not a random sample."  # line above the table for 2026, {year} is the selected year
    summary_when: "Next year: {k} of {n} right · Within {m} years (where shown): {k2} of {n2} right"  # timing summary line, counted rows only, {m} from game.second_horizon
    summary_what: "Style of the next release: right in {k} of {n} years with a release."  # summary line
    placeholder: "?"  # placeholder of a column that is not shown yet
    change_label: "Change year or artists"  # collapsed expander with the year, genre and artist pickers
    how_label: "How to read this"  # expander with the reliability lines and the legend, shown after Predict
    predict_button: "Predict"  # step 1 button, shows the model verdicts
    reveal_button: "Show reality"  # step 2 button, shows the realities, marks and summaries

style_tab:  # tab 7: Random Forest style forecast, two steps, per target year
  top_n: 10  # styles in the table, also the k of the hits
  base_years: 3  # years in the base mean the growth is measured against (the panel base of src/style_forecast.py); also hard-coded in src/style_forecast.py build_panel (base line), guarded by scripts/run_style_apptest.py
  headline: "Tested on {first} to {last}: on average {k} of the top {n} styles in reality are in the forecast top {n}."  # one neutral line, always visible, figures computed from the data
  years:  # every target year of the selector, none is hidden
    counted: [2018, 2019, 2020, 2021, 2022]  # final test years, counted in the summary
    flagged: [2023, 2024]  # shown for reference only with the asterisk marks, no summary
    none: [2025, 2026]  # no forecast
  reasons:  # reason shown for a flagged year
    2023: "Not counted: Discogs counts for {year} show unusual jumps in some styles."  # {year} is the key
    2024: "Not counted: Discogs was still adding its {year} releases."  # {year} is the key
  none_text: "No forecast for this year: Discogs counts for recent years are still incomplete."  # years without forecast
  validation_text: "Tested on {first} to {last}, the forecast gets {k} of the top {n} styles right. Repeating last year's ranking gets {b} of {n}, so the two are about equal. The ranges are a guide, and only {years} years were tested, so figures can change."  # text of the validation expander, figures computed from the data
  growth_note: "Styles are ranked by expected growth over the average of the last {n} years. A small style with high growth can rank above a large one."  # in How to read this, {n} from base_years
  range_note: "The range shows how far past forecasts were off, covering most cases. A ✓ means the count in reality fell inside it."  # in How to read this
  keys:  # widget and state keys
    year: style_year  # year selector
    stage: style_stage  # two-step state
    predict: style_predict  # Predict button
    reveal: style_reveal  # Show reality button
  texts:  # texts of the tab
    year_label: "Year to forecast"  # year selector label
    flag_counted: "Counted in the summary"  # status line of a counted year
    col_rank: "Rank"  # table column
    col_style: "Style"  # table column
    col_expected_growth: "Expected growth in releases"  # table column, the quantity that defines the rank
    col_expected: "Expected releases"  # table column
    col_range: "Likely range"  # table column
    col_actual: "Reality: releases"  # table column
    col_actual_growth: "Reality: growth"  # table column, same units as the expected growth
    percent_format: "{:+.0f}%"  # format of a growth, applied to the growth times 100
    col_result: "Reality in range?"  # table column
    summary_hits: "Top {n} styles in reality that were in the forecast top {n}: {k} of {n}."  # summary line
    summary_range: "Reality inside the range: {k} of {n} styles."  # summary line
    predict_button: "Predict"  # step 1 button
    reveal_button: "Show reality"  # step 2 button
    how_label: "How to read this"  # expander
    validation_label: "How reliable is this?"  # closed expander with the validation text, on the page from the start
