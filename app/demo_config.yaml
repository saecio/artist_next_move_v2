# Demo app settings: paths, years, texts and the artist list
paths:  # input files, relative to the project root
  row_scores: results/holdout_what/row_scores.csv  # WHAT holdout scores, one row per artist and year
  predictions: results/style_forecast/predictions.csv  # global style forecast
validation_years: [2018, 2022]  # first and last year selectable in the demo
row_scores_columns: [artist_id, year, label, stage0_score, baseline_c_score]  # columns read and shown, raw names
predictions_columns: [style, target_year, method, expected_growth, expected_works, range_low, range_high, rank]  # columns read and shown
tabs:  # tab titles, in display order
  - Introduction  # tab title, the opening screen
  - Problem and question  # tab title
  - Data and cleaning  # tab title
  - Data exploration  # tab title
  - Method  # tab title
  - Results  # tab title
  - Time Machine demo  # tab title
  - Global style forecast  # tab title
  - Conclusions  # tab title
header:  # fixed header above the tabs
  title: "Artist Next Move"  # project name
  tagline: "Predicts when an artist will release again, and whether the next release will bring a style new to them."  # one line under or beside the name
notices:  # texts shown verbatim
  style_notice: "Which styles will grow the most next year?"  # tab 7 headline
ui:  # interface labels
  genre_label: "Genre"  # genre selector
  all_genres: "All genres"  # genre selector, no filter option
  point_one: "{n} point"  # a score gap of one point (singular)
  point_many: "{n} points"  # a score gap of any other number of points (plural)
  artist_label: "Artist"  # artist selector
  year_label: "Year"  # year selector
  projection_column: "is_projection"  # boolean column added to the forecast table
