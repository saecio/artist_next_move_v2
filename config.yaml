project:
  name: "Artist Next Move"
  SEED: 1  # the single random seed of the project (models, sampling and bootstrap)

paths:
  raw: "data/raw"  # raw dumps, not versioned
  processed: "data/processed"  # parquet files, not versioned
  works: "data/processed/works_checkpoint.parquet"  # cleaned Works table
  snapshots: "data/processed/snapshots.parquet"  # cached snapshots
  results: "results"  # result files and trial logs
  style_predictions: "results/style_forecast/predictions.csv"  # stored style forecast table
  style_bundle: "results/style_forecast/models/random_forest.joblib"  # stored Random Forest fitted on origins up to 2022, read only (2024 rows)
  style_live: "results/demo/live/style"  # live scoring assets of the style forecast
  works_demo: "results/demo/works_demo.csv"  # Works of the demo artists for the timeline cards
  release_pick: "results/demo/release_pick.csv"  # release title per artist-year for the reality cells of tab 6
  when_live_features: "results/demo/live/when_features.csv"  # WHEN feature rows of the demo artists (control source)

years:
  demo_works_first_year: 2010  # first year shown in the demo timeline (display choice)
  last_complete: 2025  # last fully observed year (the dump is dated 2026-09-01)
  partial: 2026  # partly observed year, demo only
  development_last: 2017  # last development year, nothing later is used for tuning
  holdout_start: 2018  # first year of the holdout
  holdout_end: 2023  # last year of the holdout
  label_gap: 2  # years removed before a test or holdout period (longest label horizon)
  style_first_column: 1890  # first calendar column of the style by year table
  style_dev_first_target: 1993  # first development target year of the style forecast

bootstrap:
  draws: 1000  # artist-clustered bootstrap draws (WHEN and WHAT)
  confidence: 0.95  # two-sided confidence level
  style_draws: 2000  # bootstrap draws over years (style forecast)

what:
  # Minimum number of previous dated Works (artist-year level for WHAT: dated Works strictly before the year).
  min_previous_works: 3

works:
  min_standalone_releases: 3  # an artist needs at least this many standalone releases (no Master) for them to become Works (notebooks/01_cleaning_eda.ipynb, cell 98)
