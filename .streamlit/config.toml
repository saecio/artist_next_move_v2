[theme]
base = "light"
primaryColor = "#0F6B6B"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B1B1F"
borderColor = "#DDD8CC"
baseRadius = "4px"
font = "Inter, sans-serif"
headingFont = "Fraunces, serif"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-400-normal.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-500-normal.woff2"
weight = "500"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-600-normal.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-700-normal.woff2"
weight = "700"
style = "normal"

[[theme.fontFaces]]
family = "Fraunces"
url = "app/static/fonts/fraunces-latin-500-normal.woff2"
weight = "500"
style = "normal"

[[theme.fontFaces]]
family = "Fraunces"
url = "app/static/fonts/fraunces-latin-600-normal.woff2"
weight = "600"
style = "normal"

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"
